services:
  - type: web
    name: shiriel-app
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
